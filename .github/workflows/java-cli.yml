name: Java CI

on:
  push:
    branches:
      -main
    pull-request:
      branches:
        -main

  permissions:
    contents: read

  jobs:
    test:
      name: Build and test
      runs-on: ubuntu-latest

      steps:
        -name: Check out repository
         uses: actions/checkout@v7

        -name: Set up Java 21
         uses: actions/setup-java@v6
         with:
           distribution: temurin
           java-version: "21"
           cache: maven

        -name: Make Maven wrapper executable
         run: chmod +x mvnw

        -name: Run tests
         run: ./mvnw --batch-mode test